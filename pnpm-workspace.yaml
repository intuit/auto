# Keep packages/* and plugins/* in sync with "packages" in lerna.json, which the
# npm plugin reads. The docs site is a private workspace package that lerna
# never versions or publishes, so it isn't listed there.
packages:
  - packages/*
  - plugins/*
  - docs

# None of these install scripts are needed: nx's postinstall is a no-op without
# nx.json, fsevents is an optional native build, vsce only loads keytar when no
# PAT is passed (and falls back to a file store without it), and the rest only
# print banners.
allowBuilds:
  core-js: false
  ejs: false
  fsevents: false
  keytar: false
  nx: false
  simple-git-hooks: true

# jest-when only needs Vitest's global `expect`. Without this, pnpm
# auto-installs its jest peer, which pulls all of Jest into the repo.
packageExtensions:
  jest-when:
    peerDependenciesMeta:
      jest:
        optional: true

catalog:
  "@types/node": ^24.19.2
  tsdown: 0.23.4
  typescript: 6.0.3
  zod: ^4.4.0
