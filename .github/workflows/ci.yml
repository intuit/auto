name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Enabled permissions on GITHUB_TOKEN
permissions:
  # To be able to push to the repo
  contents: write
  # To update the pr description with canary info
  pull-requests: write
  # For pr-check to create a status
  statuses: write
  # Needed to create PR statuses/checks
  checks: write
  # To post comments on PRs
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build once. The other jobs install from the pnpm store this job caches and
  # restore the build output from this run's cache instead of building again.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install dependencies
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - name: Build
        run: pnpm -r run build
      # - name: Bundle
      #   run: pnpm -r run bundle
      - name: Save build
        uses: actions/cache/save@v6.1.0
        with:
          # Restores must use the same paths, or they miss the cache
          path: &build-cache-path |
            packages/*/dist
            plugins/*/dist
            */cli/build
          key: &build-cache-key build-${{ github.run_id }}

  format:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install dependencies
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - name: Check for unformatted files
        run: pnpm format:diff
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install dependencies
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - name: Lint
        run: pnpm lint
        continue-on-error: true

  typecheck:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install dependencies
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - name: Type check
        run: pnpm typecheck
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Fetch git tags
        run: git fetch --unshallow --tags
      - name: Install dependencies
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - name: Restore build
        uses: actions/cache/restore@v6.1.0
        with:
          path: *build-cache-path
          key: *build-cache-key
          fail-on-cache-miss: true
      - name: Test
        run: pnpm test:coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Builds the docs site on every run. The build fails on broken links and on
  # any page from docs/url-baseline.txt going missing.
  docs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install dependencies
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
      # The docs generator reads the built CLI, core and plugin packages
      - name: Restore build
        uses: actions/cache/restore@v6.1.0
        with:
          path: *build-cache-path
          key: *build-cache-key
          fail-on-cache-miss: true
      - name: Build docs
        run: pnpm docs:build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      - name: Upload docs
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/dist

  deploy-docs:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    needs: docs
    # Replaces the workflow's permissions, so this job can only deploy Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deploy halfway, but don't queue more than one either
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  release-canary:
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.head_commit.message, 'ci skip') &&
      !contains(github.event.head_commit.message, 'skip ci') &&
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'canary')
    needs: [build, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Fetch git tags
        run: git fetch --unshallow --tags
      - name: Install dependencies
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - name: Restore build
        uses: actions/cache/restore@v6.1.0
        with:
          path: *build-cache-path
          key: *build-cache-key
          fail-on-cache-miss: true
      - name: Create Release
        run: pnpm auto shipit -vv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ github.event.pull_request.number && secrets.NPM_TOKEN }}
          PROTECTED_BRANCH_REVIEWER_TOKEN: ${{ secrets.GH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}

  release:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == 'main' &&
      !contains(github.event.head_commit.message, 'ci skip') &&
      !contains(github.event.head_commit.message, 'skip ci')
    needs: [build, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Fetch git tags
        run: git fetch --unshallow --tags
      - name: Install dependencies
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - name: Restore build
        uses: actions/cache/restore@v6.1.0
        with:
          path: *build-cache-path
          key: *build-cache-key
          fail-on-cache-miss: true
      - name: Create Release
        run: pnpm auto shipit -vv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ github.event.pull_request.number && secrets.NPM_TOKEN }}
          PROTECTED_BRANCH_REVIEWER_TOKEN: ${{ secrets.GH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
