version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      time: "13:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      - dependency-name: log-symbols
        versions:
          - 4.1.0
      - dependency-name: jsdom
        versions:
          - 16.5.2
      - dependency-name: type-fest
        versions:
          - 1.0.1
      - dependency-name: "@types/jsdom"
        versions:
          - 16.2.9
      - dependency-name: "@fortawesome/fontawesome-svg-core"
        versions:
          - 1.2.34
          - 1.2.35
      - dependency-name: next-ignite
        versions:
          - 0.10.7
          - 0.10.8
      - dependency-name: "@octokit/rest"
        versions:
          - 18.3.0
          - 18.3.1
          - 18.3.4
      - dependency-name: typescript
        versions:
          - 4.1.3
          - 4.2.2
      - dependency-name: vsce
        versions:
          - 1.85.1
      - dependency-name: "@types/node"
        versions:
          - 14.14.25
          - 14.14.26
          - 14.14.28
          - 14.14.31
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      time: "13:00"
    labels:
      - dependencies
