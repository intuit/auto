name: "Setup"
description: Setup action

inputs:
  cache:
    description: Restore and save the pnpm store and pkg binary caches. Turn off in jobs that hold publishing secrets.
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # Reads the pnpm version from the root package.json `packageManager` field
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use nodejs
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: mise.toml
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        package-manager-cache: ${{ inputs.cache == 'true' }}

    - run: pnpm install --frozen-lockfile
      shell: bash

    - name: restore pkg cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pkg-cache
        key: pkg-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pkg-cache-${{ runner.os }}-
