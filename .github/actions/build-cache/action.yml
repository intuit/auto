name: "Build Cache"
description: build cache

runs:
  using: "composite"
  steps:
    - name: build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          packages/*/dist
          plugins/*/dist
          */cli/binary
        key: ${{ github.run_id }}
        restore-keys: ${{ github.run_id }}
